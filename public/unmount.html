<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../docs/css/autocomplete.css" />
    <title>UNMOUNT TEST</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        margin-top: 50px;
      }
      p { margin: 0; }
      .container { max-width: 350px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <section>
        <h1>Unmount test</h1>

        <!-- test 1: default mode -->
        <div class="auto-search-wrapper" id="wrap-default">
          <input type="text" id="unmount-default" placeholder="default mode" />
        </div>

        <!-- test 2: dropdownParent mode -->
        <div class="auto-search-wrapper" id="wrap-parent" style="margin-top:20px">
          <input type="text" id="unmount-parent" placeholder="dropdownParent mode" />
        </div>

        <!-- test 3: slow search (in-flight promise) -->
        <div class="auto-search-wrapper" id="wrap-slow" style="margin-top:20px">
          <input type="text" id="unmount-slow" placeholder="slow search" />
        </div>
      </section>
    </div>

    <script src="../docs/js/autocomplete.min.js"></script>
    <script>
      const data = ["Walter White", "Jesse Pinkman", "Skyler White", "Hank Schrader"];

      window.searchCalls = 0;

      const searchFn = ({ currentValue }) => {
        window.searchCalls += 1;
        return data.filter((el) => el.match(new RegExp(currentValue, "gi")));
      };

      const slowSearchFn = ({ currentValue }) => {
        window.searchCalls += 1;
        return new Promise((resolve) => {
          setTimeout(() => resolve(searchFn({ currentValue })), 1000);
        });
      };

      const resultsFn = ({ matches }) =>
        matches.map((el) => `<li><p>${el}</p></li>`).join("");

      window.resets = 0;
      const onReset = () => {
        window.resets += 1;
      };

      window.acDefault = new Autocomplete("unmount-default", {
        delay: 300,
        onSearch: searchFn,
        onResults: resultsFn,
        onReset,
      });

      window.acParent = new Autocomplete("unmount-parent", {
        delay: 300,
        dropdownParent: document.body,
        onSearch: searchFn,
        onResults: resultsFn,
        onReset,
      });

      window.acSlow = new Autocomplete("unmount-slow", {
        delay: 0,
        dropdownParent: document.body,
        onSearch: slowSearchFn,
        onResults: resultsFn,
        onReset,
      });
    </script>
  </body>
</html>
